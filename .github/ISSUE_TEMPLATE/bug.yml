name: Bug report
description: Something is broken or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't include real locations, dates, or
        personal details; anonymize any track first with `scripts/anonymize-track`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Apple Watch app, iPhone app, Website, API / sync, WaterKit / CLI, Docs, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a kayak session on the watch
        2. ...
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App version and build, device model, iOS/watchOS version, or browser.
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or an anonymized track
      description: Drag files here. Remove anything identifying first.
