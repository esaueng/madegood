name: Deploy cleanup

# Deletes a pull request's preview database (madegood-pr-<number>, created by
# deploy.yml) when the pull request closes. No path filter: a PR whose final diff no
# longer touches web/ may still have created one.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  # Shares deploy.yml's group, so a preview deploy still running for this PR is
  # cancelled rather than racing the delete.
  group: deploy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Delete the PR database
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete madegood-pr-<number> if it exists
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NAME: madegood-pr-${{ github.event.pull_request.number }}
        run: |
          # A failed lookup fails the job; only a successful lookup that finds nothing
          # skips the delete.
          list=$(pnpm exec wrangler d1 list --json)
          if echo "$list" | jq -e --arg name "$NAME" 'any(.[]; .name == $name)' > /dev/null; then
            # wrangler prints the database UUID before deleting; mask it in this job's log.
            id=$(echo "$list" | jq -r --arg name "$NAME" '.[] | select(.name == $name) | .uuid')
            echo "::add-mask::$id"
            pnpm exec wrangler d1 delete "$NAME" --skip-confirmation
          else
            echo "No database named $NAME."
          fi
