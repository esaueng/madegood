name: Deploy

# Deploys the website and API (one Cloudflare Worker, web/).
# - Pull requests: a preview version of `madegood-preview` at
#   pr-<number>-madegood-preview.<subdomain>.workers.dev, linked in a PR comment. Each
#   PR gets its own D1 database (`madegood-pr-<number>`, deleted by deploy-cleanup.yml
#   when the PR closes), so
#   one branch's migrations never change another preview's schema. Previews share the
#   preview R2 bucket; nothing touches production data.
# - Pushes to main: production (`madegood`).
#
# Real resource IDs are not in the repository (AGENTS.md). They come from repository
# variables (CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID, D1_PREVIEW_DATABASE_ID) and the
# CLOUDFLARE_API_TOKEN secret, and scripts/cloudflare-config writes them into the
# runner's copy of web/wrangler.jsonc.

on:
  pull_request:
    paths:
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "scripts/cloudflare-config"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "scripts/cloudflare-config"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
  D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}

jobs:
  preview:
    name: Preview deploy
    # Secrets are not available to pull requests from forks; PR creation is limited to
    # collaborators, so every PR comes from a branch of this repository.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or find this PR's database
        id: db
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NAME: madegood-pr-${{ github.event.pull_request.number }}
        run: |
          find_id() {
            pnpm exec wrangler d1 list --json | jq -r --arg name "$NAME" '.[] | select(.name == $name) | .uuid'
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            pnpm exec wrangler d1 create "$NAME" > /dev/null
            id=$(find_id)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Fill in resource IDs
        env:
          D1_PREVIEW_DATABASE_ID: ${{ steps.db.outputs.id }}
        run: scripts/cloudflare-config web/wrangler.jsonc
      - name: Apply migrations to this PR's database
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --env preview
      - name: Build for the preview environment
        working-directory: web
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm build
      - name: Upload a preview version
        id: upload
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload --preview-alias "$ALIAS" | tee "$RUNNER_TEMP/upload.log"
          url=$(grep -Eo "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/upload.log" | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check the preview responds
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$URL/api/health"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Link the preview in the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(printf '<!-- madegood-preview -->\n**Preview:** %s\n\nBuilt from %s. Uses its own database (deleted when this PR closes) and the preview bucket, not production data.' "$URL" "$SHA")
          # --slurp gathers every page first, so one match yields one ID.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --slurp \
            | jq -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- madegood-preview -->")))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  production:
    name: Production deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://madegood.esau.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fill in resource IDs
        run: scripts/cloudflare-config web/wrangler.jsonc
      # Build before touching the database, so a failed build changes nothing. Migrations
      # must keep the running version working (expand, deploy, then contract; see
      # docs/self-hosting.md), because they apply before the new code is live.
      - name: Build
        working-directory: web
        run: pnpm build
      # wrangler deploy fails when a queue in wrangler.jsonc does not exist yet. Before the
      # migrations, so a token without Queues permission fails before any schema change.
      - name: Create the post-processing and export queues if missing
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for queue in madegood-postprocess madegood-postprocess-dlq madegood-exports; do
            pnpm exec wrangler queues info "$queue" > /dev/null 2>&1 \
              || pnpm exec wrangler queues create "$queue"
          done
      - name: Apply migrations to the production database
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Check production responds
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://madegood.esau.workers.dev/api/health; then exit 0; fi
            sleep 5
          done
          exit 1
