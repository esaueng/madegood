name: Privacy tests

# Synthetic regression tests for the privacy scanners. No secrets, no write
# permissions; safe to run on pull-request code.
on:
  pull_request:
    paths:
      - ".github/privacy/**"
      - ".github/workflows/history-privacy.yml"
      - ".github/workflows/privacy-tests.yml"
  push:
    branches: [main]
    paths:
      - ".github/privacy/**"
      - ".github/workflows/history-privacy.yml"
      - ".github/workflows/privacy-tests.yml"

permissions:
  contents: read

concurrency:
  group: privacy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Run synthetic privacy tests
        run: python3 -m unittest discover -s .github/privacy -p 'test_*.py'
