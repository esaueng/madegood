name: WaterKit

on:
  pull_request:
    paths: &waterkit-paths
      - packages/WaterKit/**
      - .github/workflows/waterkit.yml
  push:
    branches: [main]
    paths: *waterkit-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waterkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: WaterKit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Swift 6.3.3 matches the compiler in Xcode 26.6 used by the Apple workflow.
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zlib headers
        run: |
          if [ ! -f /usr/include/zlib.h ]; then
            apt-get update -q && apt-get install -yq --no-install-recommends zlib1g-dev
          fi

      - name: Test
        run: swift test --package-path packages/WaterKit --parallel

  macos:
    name: WaterKit tests (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: swift test --package-path packages/WaterKit --parallel
