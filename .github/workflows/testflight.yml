name: TestFlight

# Builds the iPhone app (with the watch app embedded) and uploads it to App Store
# Connect. The "Internal" TestFlight group gets each build automatically once Apple has
# processed it (about 10–30 minutes).
#
# Runs when someone with write access starts it (Actions > TestFlight > Run workflow) or
# pushes a version tag (v0.2.0, ...). Each build's version is the major.minor from
# MadeGood.xcconfig plus the commit count, so it goes up with every merge. Uses scripts/testflight with these repository
# secrets: APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
# APP_STORE_CONNECT_API_KEY (the .p8 contents), and APPLE_SIGNING_P12 with
# APPLE_SIGNING_P12_PASSWORD (an Apple Development identity). See docs/self-hosting.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      TUIST_DISABLE_ANALYTICS: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      # App Store Connect requires apps built with the iOS 27 SDK (Xcode 27) from April 2027
      # (ITMS-90725). GitHub's xcode-27 image ships Xcode 27 as /Applications/Xcode.app.
      - name: Show the Xcode version
        run: xcodebuild -version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the version's patch number is the commit count (scripts/testflight).
          fetch-depth: 0

      # The version's patch number is the commit count, so an upload from any commit
      # other than main's current tip (another branch, or a re-run of an older run)
      # would ship a lower version than one already uploaded.
      - name: Require main's current tip
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$(git rev-parse HEAD)" != "$tip" ]; then
            echo "::error::This commit is not main's current tip ($tip); run the workflow from main."
            exit 1
          fi

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          cache: true

      - name: Generate Xcode project
        working-directory: apps/apple
        run: |
          tuist install
          tuist generate --no-open

      - name: Write the API key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"

      # Each runner starts with an empty keychain. Without a signing identity, automatic
      # signing creates a new Apple Development certificate on every run until the account
      # hits Apple's limit and archiving fails. So the runner imports one long-lived
      # certificate (APPLE_SIGNING_P12, base64 .p12, with APPLE_SIGNING_P12_PASSWORD) into
      # a throwaway keychain, and Xcode reuses it. Distribution signing at export still
      # uses Apple's cloud-managed certificate.
      - name: Install the signing certificate
        env:
          P12: ${{ secrets.APPLE_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Set the APPLE_SIGNING_P12 and APPLE_SIGNING_P12_PASSWORD secrets (docs/self-hosting.md); without them every run creates a new Apple Development certificate."
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Put it first in the search list, keeping the runner's own keychains after it.
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/signing.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Development" \
            || { echo "::error::APPLE_SIGNING_P12 holds no Apple Development identity."; exit 1; }
          echo "Signing identity: installed"

      # Build numbers must increase across every upload, including re-runs of older
      # runs, so they come from the UTC clock (YYYYMMDD.HHMMSS) rather than the run number.
      - name: Choose the build number
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d).$((10#$(date -u +%H%M%S)))" >> "$GITHUB_ENV"

      - name: Archive and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          WORK_DIR: ${{ runner.temp }}/testflight
          # Repository secret, not a variable: secrets are masked in the log, and the URL
          # names the deployer's Workers subdomain. The API root the app syncs with.
          MADEGOOD_API_URL: ${{ secrets.MADEGOOD_API_URL }}
        run: scripts/testflight

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.p12"

      # The repository is public and artifacts are not masked like the console, so take
      # the account identifiers out of the logs before uploading them.
      - name: Redact the logs
        if: failure()
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MADEGOOD_API_URL: ${{ secrets.MADEGOOD_API_URL }}
        run: |
          shopt -s nullglob
          # The API URL's host names the deployer's Workers subdomain; redact it in any form.
          api_host="${MADEGOOD_API_URL#*://}"
          api_host="${api_host%%/*}"
          for log in "$RUNNER_TEMP"/testflight/*.log; do
            for value in "$APPLE_TEAM_ID" "$APP_STORE_CONNECT_KEY_ID" "$APP_STORE_CONNECT_ISSUER_ID" "$MADEGOOD_API_URL" "$api_host"; do
              [ -n "$value" ] || continue
              VALUE="$value" perl -pi -e 's/\Q$ENV{VALUE}\E/[redacted]/g' "$log"
            done
          done

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/testflight/*.log
          retention-days: 7
