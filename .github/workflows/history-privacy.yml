name: History privacy

# Publishes the required history-privacy and commit-privacy checks through the
# Esau History Privacy App. Every trigger below runs this file as it exists on
# main, never a pull request's copy, and the history-privacy environment only
# releases its secrets to main. See .github/privacy/README.md.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      audit_head:
        description: "Optional exact commit to audit; empty audits every branch and tag"
        required: false
        type: string
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

jobs:
  history-privacy-audit:
    environment: history-privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The scanner comes from the commit that defined this run (main), never
      # from the incoming head. Incoming objects are fetched later as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/privacy
      - name: Create check publisher token
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HISTORY_PRIVACY_APP_CLIENT_ID }}
          private-key: ${{ secrets.HISTORY_PRIVACY_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Scan new history and publish history-privacy
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          # Contents-read job token: lets Git fetch this private repository.
          GH_READ_TOKEN: ${{ github.token }}
          HISTORY_PRIVACY_HMAC_KEY: ${{ secrets.HISTORY_PRIVACY_HMAC_KEY }}
        run: python3 .github/privacy/history_privacy.py --ci
      - name: Check commit identities and publish commit-privacy
        if: always() && steps.publisher.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 .github/privacy/commit_privacy.py
